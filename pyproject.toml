[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "burnscope"
version = "0.1.0"
description = "Cross-platform Stress Testing Tool"
requires-python = ">=3.12"
dependencies = ["psutil>=7,<8"]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "pyqtgraph>=0.13.7,<0.15", "numpy>=2,<3"]
gpu = ["pyopencl>=2025.1", "numpy>=2,<3", "nvidia-ml-py>=12,<14"]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["burnscope*"]

[tool.setuptools.package-data]
burnscope = ["kernels/*.cl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
